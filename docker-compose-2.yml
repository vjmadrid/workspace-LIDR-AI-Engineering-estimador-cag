# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override REDIS_URL for the in-network Redis service. The .env value
    # (redis://localhost:6379) is meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image.
    volumes:
      - ./app:/app/app

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/manager/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: estimator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: estimator-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5540/api/health/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
  redisinsight_data:
